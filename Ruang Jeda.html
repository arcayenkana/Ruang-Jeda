  function vp(c,i,t,d){return '<div class="vp"><span class="glyph" style="--c:'+c+'">'+ic(i)+'</span><div><b>'+t+'</b><div class="small muted">'+d+'</div></div></div>';}
  return '<div class="kv full welcome">'+kvArt()+topbar(true)+'<div class="kvtxt"><p class="hello">Selamat datang di Ruang Jeda</p><h1>Berhenti sebentar. Tarik napas.</h1>'+
   '<p style="margin:10px 0 0">Belajar mengenali emosi, cemas, citra diri, dan bullying dari '+esc(pikrName())+'. Gratis, anonim, dan cukup 5 menit sekali buka.</p>'+
   '<div class="row" style="margin-top:18px"><button class="btn onkv" data-a="start">Mulai sekarang</button><button class="btn onkv2" data-a="nav" data-v="napas">'+ic("wind")+' Coba napas 1 menit</button></div></div></div>'+
  '<div class="stack"><div class="card wallet">'+
   vp("var(--m-emosi)","book","4 modul singkat","Emosi dan stres, cemas, citra diri, dan bullying, lengkap dengan kuis.")+
   vp("var(--m-diri)","heart","Check-in harian","Cek perasaanmu dan dapat saran kecil yang bisa langsung dicoba.")+
   vp("var(--seg-kolab)","trophy","Poin, badge, dan peringkat","Belajar jadi lebih seru, tetap memakai nama panggilan.")+
  '</div>'+
  '<button class="btn block" data-a="nav" data-v="faq">'+ic("help")+' Pertanyaan umum (FAQ)</button>'+
  '<p class="small muted">Ruang Jeda adalah materi edukasi, bukan pengganti psikolog atau konselor. Kalau kamu butuh bicara sekarang, tombol Bantuan ada di pojok atas.</p></div>';
}
function vOnb(){
  var editing=!!S.nick,complete=editing&&!S.seg;
  if(!OB)OB={nick:S.nick||"",seg:S.seg||""};
  var title=!editing?"Satu langkah lagi":(complete?"Lengkapi profilmu":"Ubah profilmu");
  var sub=!editing?"Pilih nama panggilan dan segmen. Tanpa nama asli, tanpa daftar akun.":"Nama panggilan dan segmen tampil di peringkat.";
  return '<div class="kv head">'+kvArt()+topbar(true)+'<div class="kvtxt"><h1>'+title+'</h1><p style="margin:6px 0 0">'+sub+'</p></div></div>'+
  '<div class="stack"><div class="card stack">'+
   '<div class="field"><label for="nick">Nama panggilan (bukan nama asli)</label>'+
   '<div class="row" style="flex-wrap:nowrap"><input class="input grow" id="nick" maxlength="16" autocomplete="off" value="'+esc(OB.nick)+'" placeholder="contoh: TenangKunang42"><button class="btn" data-a="randNick" type="button">Acak</button></div></div>'+
   '<div class="field"><div class="lbl" id="segLbl">Pilih segmenmu, sesuai usia</div><div class="segs" role="group" aria-labelledby="segLbl">'+
   SEG.map(function(s){return '<button type="button" class="segc" style="--c:'+s.c+'" data-a="segPick" data-v="'+s.id+'" aria-pressed="'+(OB.seg===s.id)+'"><span class="sd">'+esc(s.n.charAt(0))+'</span><span><b>'+esc(s.n)+'</b><span class="small muted">'+esc(s.age)+'</span></span></button>';}).join("")+'</div>'+
   '<div class="small muted">Usiamu tidak disimpan, hanya segmennya. Segmen dipakai supaya peringkat adil.</div></div>'+
   '<div class="err" id="onbErr">'+esc(onbErr)+'</div>'+
   '<button class="btn primary block" data-a="saveNick">'+(editing?"Simpan":"Mulai belajar")+'</button>'+
   (editing&&S.seg?'<button class="btn ghost block" data-a="nav" data-v="me">Batal</button>':'')+
   (!editing?'<button class="btn ghost block" data-a="nav" data-v="welcome">Kembali</button>':'')+
  '</div>'+
  '<p class="small muted">Yang dibagikan ke peringkat dan rekap hanya nama panggilan, segmen, poin, skor kuis, dan apakah kamu tertarik pada PIKR. Check-in suasana hatimu hanya tersimpan di HP ini.</p></div>';
}

/* ---------- Beranda ---------- */
function todayChallenge(off){
  var d=new Date(),day=Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);
  return CHALLENGES[(day+(off||0))%CHALLENGES.length];
}
function moodRow(mood){
  return '<div class="mood" role="group" aria-label="Suasana hati">'+MOODS.map(function(m){return '<button data-a="mood" data-n="'+m.n+'" aria-pressed="'+(mood===m.n)+'">'+face(m)+'<span>'+m.l+'</span></button>';}).join("")+'</div>';
}
var MENU=[["mods","Belajar","book","var(--m-emosi)"],["napas","Napas","wind","var(--m-cemas)"],["chal","Tantangan","bolt","var(--m-bully)"],["board","Peringkat","trophy","var(--seg-kolab)"],
          ["badge","Badge","star","var(--m-diri)"],["faq","FAQ","help","var(--m-emosi)"],["help","Bantuan","ring","var(--bad)"],["me","Profil","user","var(--m-cemas)"]];
function vHome(){
  var p=points(),lv=levelOf(p),nx=nextLevel(p),st=streak(),today=dkey(),mood=S.mood[today];
  var pct=nx?Math.round((p-lv.min)/(nx.min-lv.min)*100):100;
  var ns=nextStep(),ch=todayChallenge(0),chDone=!!S.chal[today],seg=segOf(S.seg);
  var h='<div class="kv full">'+kvArt()+topbar(true)+'<div class="kvtxt"><p class="hello">Halo, '+esc(S.nick)+'</p><h1>'+(mood?"Terima kasih sudah check-in":"Lagi ngerasa gimana hari ini?")+'</h1>'+moodRow(mood)+
   (mood?'<div class="reply"><div>'+esc(MOOD_TIP[mood])+'</div><div class="row"><button class="btn small onkv2" data-a="nav" data-v="napas">'+ic("wind")+' Latihan napas</button>'+(mood<=2?'<button class="btn small onkv" data-a="help">'+ic("ring")+' Butuh bicara?</button>':'')+'</div></div>':
     '<p class="small" style="margin:10px 0 0">Check-in hanya tersimpan di HP ini. +5 poin sekali sehari.</p>')+'</div></div>';
  h+='<div class="stack"><div class="card wallet stack">'+
   '<div class="w-top"><div><div class="eyebrow">Poinmu</div><b class="big num">'+p+'</b></div><div class="w-r"><span class="chip warm">'+esc(lv.n)+'</span>'+(seg?'<span class="chip seg" style="--c:'+seg.c+'">'+esc(seg.n)+'</span>':'')+(st>0?'<span class="streak">'+ic("flame")+st+' hari</span>':'')+'</div></div>'+
   '<div><div class="bar warm" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div><div class="small muted" style="margin-top:6px">'+(nx?(nx.min-p)+' poin lagi menuju '+esc(nx.n):'Level tertinggi tercapai')+'</div></div>'+
   (ns?'<button class="cont" data-a="open" data-id="'+ns.m.id+'"><span class="glyph" style="--c:'+ns.m.color+'">'+ic(ns.m.icon)+'</span><span class="grow"><b>Lanjutkan belajar</b><br><span class="small muted">'+esc(ns.m.short)+', '+ns.label.toLowerCase()+'</span></span>'+ic("right")+'</button>':
      '<div class="cont done"><span class="glyph" style="--c:var(--ok)">'+ic("check")+'</span><span class="grow"><b>Semua modul tuntas</b><br><span class="small muted">Lanjutkan dengan tantangan harian.</span></span></div>')+
  '</div>';
  h+='<div class="menu">'+MENU.map(function(m){
    var attr=m[0]==="help"?'data-a="help"':'data-a="nav" data-v="'+m[0]+'"';
    return '<button '+attr+'><span class="mi" style="--c:'+m[3]+'">'+ic(m[2])+'</span><span>'+m[1]+'</span></button>';
  }).join("")+'</div>';
  h+='<div class="sechead"><h2>Modul untukmu</h2><button data-a="nav" data-v="mods">Lihat semua</button></div>'+
   '<div class="rail">'+MODS.map(function(m){
     var d=modItemsDone(m),pc=Math.round(d/7*100);
     return '<button class="rc" data-a="open" data-id="'+m.id+'"><span class="glyph" style="--c:'+m.color+'">'+ic(m.icon)+'</span><b>'+esc(m.name)+'</b><span class="small muted">'+m.minutes+' menit, '+(modComplete(m)?'tuntas':d+' dari 7 langkah')+'</span><div class="bar"><i style="width:'+pc+'%"></i></div></button>';
   }).join("")+'</div>';
  h+='<div class="card '+(chDone?'':'warm')+'"><div class="eyebrow">Tantangan hari ini, +15 poin</div><h3 style="margin:6px 0 12px">'+esc(ch)+'</h3>'+
   (chDone?'<span class="chip ok">'+ic("check")+' Selesai</span>':'<button class="btn primary" data-a="chal">Sudah kulakukan</button>')+'</div>';
  h+='<p class="small muted">Ruang Jeda adalah materi edukasi, bukan diagnosis dan bukan pengganti konselor atau psikolog.</p></div>';
  return h;
}
function nextStep(){
  for(var i=0;i<MODS.length;i++){
    var m=MODS[i];if(modComplete(m))continue;
    var sc=secCount(m);
    var label=S.pre[m.id]==null?"Mulai dengan pre-test":(sc<5?"Lanjut membaca":"Kerjakan post-test");
    return {m:m,label:label};
  }
  return null;
}

function vMods(){
  return kvHead("Belajar","Modul belajar","Urutan tiap modul: pre-test, 4 materi, studi kasus, lalu post-test.")+'<div class="stack">'+
  MODS.map(function(m){
    var d=modItemsDone(m),pc=Math.round(d/7*100);
    return '<button class="mod" data-a="open" data-id="'+m.id+'"><span class="glyph" style="--c:'+m.color+'">'+ic(m.icon)+'</span><span class="grow"><h3>'+esc(m.name)+'</h3><span class="small muted">'+m.minutes+' menit, '+(modComplete(m)?'tuntas':d+' dari 7 langkah')+'</span><div class="bar"><i style="width:'+pc+'%"></i></div></span>'+ic("right")+'</button>';
  }).join("")+'</div>';
}

/* ---------- Tantangan dan badge ---------- */
function vChal(){
  var today=dkey(),done=!!S.chal[today],st=streak(),n=Object.keys(S.chal).length,names=["Min","Sen","Sel","Rab","Kam","Jum","Sab"],days=[];
  for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push({d:d,t:i===0});}
  return kvHead("Tantangan","Satu langkah kecil hari ini","Kebiasaan kecil yang konsisten lebih berguna daripada satu usaha besar.")+'<div class="stack">'+
   '<div class="card '+(done?'':'warm')+' stack"><div class="eyebrow">Tantangan hari ini, +15 poin</div><h2 style="font-size:1.25rem;margin:0">'+esc(todayChallenge(0))+'</h2>'+
   (done?'<span class="chip ok" style="align-self:flex-start">'+ic("check")+' Selesai</span>':'<button class="btn primary" data-a="chal" style="align-self:flex-start">Sudah kulakukan</button>')+'</div>'+
   '<div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Seminggu terakhir</h2><span class="streak">'+ic("flame")+st+' hari beruntun</span></div>'+
   '<div class="week">'+days.map(function(x){var k=dkey(x.d),on=!!(S.chal[k]||S.mood[k]);return '<div class="wd'+(on?' on':'')+(x.t?' today':'')+'"><span>'+(on?ic("check"):x.d.getDate())+'</span>'+names[x.d.getDay()]+'</div>';}).join("")+'</div>'+
   '<div class="small muted">Hari aktif dihitung dari check-in suasana hati atau tantangan.</div></div>'+
   '<div class="card stack"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Menuju badge 5 tantangan</h3><b class="num">'+Math.min(n,5)+'/5</b></div><div class="bar warm"><i style="width:'+Math.min(100,n/5*100)+'%"></i></div></div>'+
   '<div class="card flat"><div class="eyebrow">Besok</div><p style="margin:4px 0 0" class="muted">'+esc(todayChallenge(1))+'</p></div></div>';
}
function vBadge(){
  var got=earned().map(function(b){return b.id;});
  return kvHead("Koleksi",got.length+" dari "+BADGES.length+" badge","Selesaikan modul dan tantangan untuk membuka badge baru.")+'<div class="stack">'+
   BADGES.map(function(b){var on=got.indexOf(b.id)>=0;return '<div class="bl'+(on?'':' off')+'"><span class="medal">'+ic(on?b.i:"lock")+'</span><div class="grow"><b>'+esc(b.n)+'</b><div class="small muted">'+esc(b.h)+'</div></div>'+(on?'<span class="chip ok">Terbuka</span>':'')+'</div>';}).join("")+'</div>';
}

/* ---------- Peringkat ---------- */
function lvName(p){return levelOf(p||0).n;}
function vBoard(){
  if(boardSeg===null)boardSeg=S.seg||"semua";
  var rows=BOARD.slice().sort(function(a,b){return (b.pts||0)-(a.pts||0)||(a.upd||0)-(b.upd||0);});
  var chipTxt=SYNC==="online"?'<span class="chip ok">Tersambung</span>':(SYNC==="read"?'<span class="chip warm">Hanya melihat</span>':'<span class="chip plain">Mode HP saja</span>');
  var h=kvHead("Peringkat","Peringkat","Poin dari membaca, kuis, check-in, dan tantangan.")+'<div class="stack">';
  h+='<div class="row">'+chipTxt+'<span class="small muted">'+(SYNC==="online"?"Skormu ikut tampil di peringkat.":(SYNC==="read"?"Skormu belum bisa dikirim dari akun ini.":"Peringkat bersama belum tersambung. Poinmu tetap tersimpan di HP ini."))+'</span></div>';
  h+='<div class="tabs" role="group"><button data-a="btab" data-t="ind" aria-pressed="'+(boardTab==="ind")+'">Individu</button><button data-a="btab" data-t="kls" aria-pressed="'+(boardTab==="kls")+'">Kelompok</button></div>';
  if(boardTab==="ind"){
    h+='<div class="fchips" role="group" aria-label="Filter segmen"><button class="fchip" data-a="bseg" data-s="semua" aria-pressed="'+(boardSeg==="semua")+'">Semua</button>'+
      SEG.map(function(s){return '<button class="fchip" style="--c:'+s.c+'" data-a="bseg" data-s="'+s.id+'" aria-pressed="'+(boardSeg===s.id)+'"><i></i>'+esc(s.n)+'</button>';}).join("")+'</div>';
    var list=boardSeg==="semua"?rows:rows.filter(function(r){return r.seg===boardSeg;});
    if(!list.length){
      var p=points();
      if(!rows.length||boardSeg===S.seg||boardSeg==="semua")h+='<div class="rank me"><div class="pos">-</div><div class="grow"><div class="nm">'+esc(S.nick)+' (kamu)</div><div class="small muted">'+esc(lvName(p))+'</div></div><div class="pts">'+p+'</div></div>';
      h+='<div class="card flat"><p class="muted" style="margin:0">'+(SYNC==="local"?"Peringkat bersama akan muncul saat peserta lain tersambung.":"Belum ada peserta di kelompok ini. Jadilah yang pertama menyelesaikan satu modul.")+'</p></div>';
    }else{
      var meIdx=-1;list.forEach(function(r,i){if(UID&&r._id===UID)meIdx=i;});
      h+=list.slice(0,20).map(function(r,i){return rankRow(r,i+1,UID&&r._id===UID);}).join("");
      if(meIdx>=20)h+='<div class="small muted" style="text-align:center">...</div>'+rankRow(list[meIdx],meIdx+1,true);
    }
  }else{
    var g=SEG.map(function(s){var m=rows.filter(function(r){return r.seg===s.id;});return {s:s,n:m.length,a:m.length?m.reduce(function(a,r){return a+(r.pts||0);},0)/m.length:0};}).sort(function(a,b){return b.a-a.a;});
    h+='<p class="small muted" style="margin:0">Tiga segmen PIKR, diurutkan dari rata-rata poin per anggota supaya adil bagi segmen yang jumlah pesertanya berbeda.</p>'+g.map(function(x,i){
      return '<div class="rank'+(S.seg===x.s.id?' me':'')+'"><div class="pos">'+(i+1)+'</div><div class="grow"><div class="nm"><span class="chip seg" style="--c:'+x.s.c+'">'+esc(x.s.n)+'</span></div><div class="small muted">'+esc(x.s.age)+', '+x.n+' peserta</div></div><div class="pts">'+(x.n?Math.round(x.a):"-")+'</div></div>';
    }).join("");
  }
  return h+'</div>';
}
function rankRow(r,pos,me){
  var s=segOf(r.seg);
  return '<div class="rank'+(me?' me':'')+'"><div class="pos">'+pos+'</div><div class="grow"><div class="nm">'+esc(r.nick||"Peserta")+(me?" (kamu)":"")+'</div><div class="small muted">'+esc(lvName(r.pts))+(s?", "+esc(s.n):"")+'</div></div><div class="pts">'+(r.pts||0)+'</div></div>';
}

/* ---------- Profil ---------- */
function vMe(){
  var p=points(),lv=levelOf(p),nx=nextLevel(p),pct=nx?Math.round((p-lv.min)/(nx.min-lv.min)*100):100,got=earned().map(function(b){return b.id;}),seg=segOf(S.seg);
  var h=kvHead("Profilmu",S.nick,"",'<div class="row" style="margin-top:10px"><span class="chip warm">'+esc(lv.n)+'</span>'+(seg?'<span class="chip seg" style="--c:'+seg.c+'">'+esc(seg.n)+', '+esc(seg.age)+'</span>':'')+'</div>')+'<div class="stack">';
  h+='<div class="card stack"><div><div class="eyebrow">Poin</div><b class="big num">'+p+'</b></div><div><div class="bar warm"><i style="width:'+pct+'%"></i></div><div class="small muted" style="margin-top:6px">'+(nx?(nx.min-p)+' poin lagi menuju '+esc(nx.n):'Level tertinggi tercapai')+'</div></div>'+
   '<button class="btn small" data-a="rename" style="align-self:flex-start">Ganti nama atau segmen</button></div>';
  h+='<div class="card"><div class="sechead" style="margin:0 0 10px"><h2 style="margin:0">Badge</h2><button data-a="nav" data-v="badge">Lihat semua</button></div><div class="badges">'+BADGES.slice(0,6).map(function(b){var on=got.indexOf(b.id)>=0;return '<div class="badge'+(on?'':' off')+'"><span class="medal">'+ic(on?b.i:"lock")+'</span><b>'+esc(b.n)+'</b></div>';}).join("")+'</div></div>';
  if(!S.puas){
    var ok=SV.a&&SV.b&&SV.c&&SV.d&&SV.e;
    h+='<div class="card stack"><div><h2>Survei singkat</h2><p class="small muted" style="margin:0">Jawabanmu membantu kader PIKR memperbaiki Ruang Jeda. +20 poin. 1 = tidak setuju, 5 = sangat setuju.</p></div>'+
     [["a","Ruang Jeda mudah dipakai."],["b","Materinya membantu aku memahami diri sendiri."],["c","Aku akan mengajak temanku memakainya."],["d","Setelah memakai Ruang Jeda, aku lebih paham apa itu PIKR."],["e","Aku tertarik ikut kegiatan PIKR."]].map(function(q){
      return '<div><div style="font-weight:600;margin-bottom:6px">'+q[1]+'</div><div class="rate">'+[1,2,3,4,5].map(function(n){return '<button data-a="rate" data-k="'+q[0]+'" data-n="'+n+'" aria-pressed="'+(SV[q[0]]===n)+'">'+n+'</button>';}).join("")+'</div></div>';
     }).join("")+'<button class="btn primary" data-a="sendSurvey"'+(ok?'':' disabled')+'>Kirim survei</button></div>';
  }else{
    h+='<div class="card soft"><h3>Terima kasih sudah mengisi survei</h3><p class="small muted" style="margin:0">Jawabanmu sudah tercatat.</p></div>';
  }
  h+='<div class="card soft stack"><div><h3>Untuk kader dan fasilitator</h3><p class="small muted" style="margin:0">Panduan menyampaikan modul, rencana sesi, dan protokol keselamatan.'+(ADMIN?' Rekap hasil trial hanya terlihat oleh akun editor.':'')+'</p></div><div class="row"><button class="btn" data-a="fasil" data-k="">Buka panduan fasilitator</button>'+(ADMIN?'<button class="btn primary" data-a="nav" data-v="rekap">'+ic("chart")+' Rekap trial</button>':'')+'</div></div>';
  h+='<div class="card flat stack"><h3>Data kamu</h3><p class="small muted" style="margin:0">Progres belajar dan check-in tersimpan di HP ini. Nama panggilan, segmen, poin, skor kuis, dan apakah kamu tertarik pada PIKR dikirim ke peringkat dan rekap bila tersambung. Tidak ada nama asli, nomor HP, atau isi catatanmu.</p>'+
   (resetConfirm?'<div class="row"><button class="btn small" data-a="resetYes" style="color:var(--bad);border-color:var(--bad)">Ya, hapus semua</button><button class="btn small ghost" data-a="resetNo">Batal</button></div>':'<button class="btn small" data-a="resetAsk" style="align-self:flex-start">Hapus data saya</button>')+'</div>';
  return h+'</div>';
}

/* ---------- Rekap kader ---------- */
function vRekap(){
  if(!ADMIN)return vHome();
  var rows=BOARD,n=rows.length;
  var h=topbar()+'<div class="stack">'+backBtn("me","Profil")+'<div><div class="eyebrow">Untuk kader PIKR</div><h1 style="font-size:1.6rem">Rekap trial</h1><p class="muted" style="margin:6px 0 0">Ringkasan dari peserta yang tersambung. Nama panggilan saja, tanpa data pribadi.</p></div>';
  var avgPts=avg(rows.map(function(r){return r.pts||0;}));
  var allDone=rows.filter(function(r){return r.mods&&MODS.every(function(m){return r.mods[m.id]&&r.mods[m.id].done;});}).length;
  h+='<div class="stats"><div class="stat"><b class="num">'+n+'</b><span>peserta</span></div><div class="stat"><b class="num">'+(avgPts==null?"-":Math.round(avgPts))+'</b><span>rata-rata poin</span></div><div class="stat"><b class="num">'+allDone+'</b><span>tuntas semua</span></div></div>';
  h+='<div class="card"><h2>Pre-test dan post-test</h2><div class="scroll-x" style="margin-top:8px"><table class="table"><thead><tr><th>Modul</th><th>Pre</th><th>Post</th><th>Naik</th><th>Tuntas</th></tr></thead><tbody>'+
   MODS.map(function(m){
    var pre=[],post=[],dl=[],dn=0;
    rows.forEach(function(r){var x=r.mods&&r.mods[m.id];if(!x)return;if(typeof x.pre==="number")pre.push(x.pre);if(typeof x.post==="number")post.push(x.post);if(typeof x.pre==="number"&&typeof x.post==="number")dl.push(x.post-x.pre);if(x.done)dn++;});
    var d=avg(dl);
    return '<tr><td>'+esc(m.short)+'</td><td>'+fmt1(avg(pre))+' <span class="muted">('+pre.length+')</span></td><td>'+fmt1(avg(post))+' <span class="muted">('+post.length+')</span></td><td>'+(d==null?"-":(d>0?"+":"")+fmt1(d))+'</td><td>'+dn+'</td></tr>';
   }).join("")+'</tbody></table></div><p class="small muted" style="margin:8px 0 0">Skor rata-rata dari 5. Angka dalam kurung adalah jumlah peserta. Naik dihitung dari peserta yang punya pre dan post.</p></div>';
  h+=segRekap(rows,n);
  var pu=rows.filter(function(r){return r.puas;});
  h+='<div class="card"><h2>Kepuasan</h2>'+(pu.length?
   [["a","Mudah dipakai"],["b","Materi membantu"],["c","Akan mengajak teman"],["d","Lebih paham apa itu PIKR"],["e","Tertarik ikut kegiatan PIKR"]].map(function(q){var a=avg(pu.filter(function(r){return typeof r.puas[q[0]]==="number";}).map(function(r){return r.puas[q[0]];}));return '<div class="row" style="justify-content:space-between;padding-block:6px;border-bottom:1px solid var(--line)"><span>'+q[1]+'</span><b class="num">'+fmt1(a)+' / 5</b></div>';}).join("")+'<p class="small muted" style="margin:8px 0 0">'+pu.length+' responden</p>':'<p class="muted" style="margin:6px 0 0">Belum ada yang mengisi survei.</p>')+'</div>';

function segRekap(rows,n){
  function pc(x){return n?Math.round(x/n*100)+"%":"-";}
  var baca=rows.filter(function(r){return !!r.pikrRead;}).length,minat=rows.filter(function(r){return !!r.minat;}).length;
  var line=SEG.map(function(s){
    var m=rows.filter(function(r){return r.seg===s.id;});
    var a=avg(m.map(function(r){return r.pts||0;}));
    var dn=m.filter(function(r){return r.mods&&MODS.every(function(x){return r.mods[x.id]&&r.mods[x.id].done;});}).length;
    var mi=m.filter(function(r){return !!r.minat;}).length;
    return '<tr><td>'+esc(s.n)+' <span class="muted">'+esc(s.age.replace(" tahun",""))+'</span></td><td>'+m.length+'</td><td>'+(a==null?"-":Math.round(a))+'</td><td>'+dn+'</td><td>'+mi+'</td></tr>';
  }).join("");
  var none=rows.filter(function(r){return !segOf(r.seg);}).length;
  return '<div class="card"><h2>Segmen dan PIKR</h2><div class="scroll-x" style="margin-top:8px"><table class="table"><thead><tr><th>Segmen</th><th>Peserta</th><th>Poin rata-rata</th><th>Tuntas</th><th>Tertarik PIKR</th></tr></thead><tbody>'+line+'</tbody></table></div>'+
   '<div class="row" style="justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line);margin-top:6px"><span>Membaca FAQ bagian PIKR</span><b class="num">'+baca+' ('+pc(baca)+')</b></div>'+
   '<div class="row" style="justify-content:space-between;padding-block:8px"><span>Tertarik tahu lebih lanjut</span><b class="num">'+minat+' ('+pc(minat)+')</b></div>'+
   (none?'<p class="small muted" style="margin:6px 0 0">'+none+' peserta belum memilih segmen.</p>':'')+
   '<p class="small muted" style="margin:6px 0 0">Minat hanya mencatat bahwa peserta ingin tahu lebih lanjut, bukan jumlah pendaftar.</p></div>';
}

function stopBreath(){if(BR){clearTimeout(BR.t);clearInterval(BR.c);BR=null;}}
function startBreath(){}
function runBreath(){
  stopBreath();
  var orb=$("#orb"),tx=$("#brTxt"),sub=$("#brSub"),btn=$("#brBtn");
  if(!orb)return;
  var still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  BR={round:0,t:null,c:null};
  btn.textContent="Berhenti";btn.setAttribute("data-a","brStop");
  function phase(kind){
    var secs=kind==="in"?4:6,left=secs;
    tx.textContent=kind==="in"?"Tarik napas":"Hembuskan pelan";
    sub.textContent="Putaran "+BR.round+" dari 5";
    orb.textContent=left;
    if(!still){orb.style.transition="transform "+secs+"s ease-in-out";orb.style.transform=kind==="in"?"scale(1.35)":"scale(.75)";}
    clearInterval(BR.c);
    BR.c=setInterval(function(){left--;if(left>0)orb.textContent=left;},1000);
    BR.t=setTimeout(function(){
      if(kind==="in"){phase("out");}
      else if(BR.round>=5){finish();}
      else{BR.round++;phase("in");}
    },secs*1000);
  }
  function finish(){
    clearInterval(BR.c);BR=null;
    tx.textContent="Selesai";sub.textContent="Rasakan tubuhmu sebentar. Bagaimana perasaanmu sekarang?";orb.textContent="";
    btn.textContent="Ulangi";btn.setAttribute("data-a","brStart");
  }
  BR.round=1;phase("in");
}

var FASIL_INFO=[{"k":"umum","icon":"user","t":"Peran dan prinsip fasilitator","sub":"Baca ini dulu sebelum sesi pertama","html":"<h3>Peranmu</h3><p>Fasilitator bukan konselor atau psikolog. Tugasmu menyampaikan materi, memandu diskusi dengan aman, dan <strong>merujuk</strong> peserta yang membutuhkan bantuan lebih. Kamu tidak perlu punya semua jawaban. \"Aku nggak tahu, kita tanyakan ke guru BK ya\" adalah jawaban yang baik.</p><h3>Prinsip</h3><ul><li><strong>Aman dulu.</strong> Keselamatan dan kenyamanan peserta lebih penting daripada menyelesaikan materi.</li><li><strong>Tidak menghakimi.</strong> Semua jawaban diterima. Tidak ada jawaban yang ditertawakan.</li><li><strong>Sukarela.</strong> Peserta boleh melewati pertanyaan (pass) tanpa alasan.</li><li><strong>Bahasa sehari-hari.</strong> Hindari istilah klinis. Jelaskan dengan contoh dari kehidupan mereka.</li><li><strong>Fokus pada pola, bukan orang.</strong> Jangan menyebut nama teman, guru, atau keluarga saat berbagi cerita.</li><li><strong>Edukasi, bukan diagnosis.</strong> Jangan mengatakan \"kamu depresi\" atau \"kamu kena gangguan kecemasan\".</li></ul><h3>Kesepakatan bersama (bacakan di awal)</h3><ol><li>Kita saling menghormati dan tidak menertawakan jawaban orang lain.</li><li>Boleh pass. Tidak ada yang dipaksa bercerita.</li><li>Cerita pribadi tidak dibawa keluar ruangan tanpa izin. Pengecualiannya kalau ada yang berisiko dalam bahaya: kita akan membantu mencarikan bantuan.</li><li>Kita tidak menyebut nama orang lain dalam cerita.</li><li>Boleh keluar sebentar kalau butuh jeda.</li></ol><h3>Kalimat yang membantu dan yang sebaiknya dihindari</h3><div class='scroll-x'><table class='table'><thead><tr><th>Hindari</th><th>Coba</th></tr></thead><tbody><tr><td>\"Ah, gitu aja stres.\"</td><td>\"Kedengarannya berat. Terima kasih sudah cerita.\"</td></tr><tr><td>\"Kamu harus kuat dan bersyukur aja.\"</td><td>\"Wajar kalau kamu merasa begitu.\"</td></tr><tr><td>\"Kenapa kamu nggak...?\"</td><td>\"Apa yang sudah kamu coba sejauh ini?\"</td></tr><tr><td>\"Jangan bilang siapa-siapa ya.\"</td><td>\"Aku mau bantu. Mungkin kita perlu melibatkan orang dewasa lain, dan kita cari bareng.\"</td></tr><tr><td>\"Kamu depresi, ya?\"</td><td>\"Yang kamu ceritakan layak diperiksa tenaga profesional.\"</td></tr></tbody></table></div><h3>Batasan peranmu</h3><ul><li>Tidak mendiagnosis dan tidak menyarankan obat atau dosis.</li><li>Tidak memaksa peserta bercerita atau menyebut pengalaman pribadinya.</li><li>Tidak menjanjikan kerahasiaan mutlak. Kalau ada risiko keselamatan, orang dewasa yang berwenang harus dilibatkan.</li><li>Tidak menggantikan konselor. Selalu sebutkan jalur bantuan (guru BK, puskesmas, layanan konseling).</li></ul>"},{"k":"segmen","icon":"people","t":"Menyesuaikan dengan segmen","sub":"Berani, Beraksi, dan Berkolaborasi","html":"<h3>Tiga segmen PIKR</h3><ul><li><strong>Berani:</strong> 10–14 tahun</li><li><strong>Beraksi:</strong> 15–19 tahun</li><li><strong>Berkolaborasi:</strong> 20–24 tahun</li></ul><p>Peserta memilih segmen sendiri di aplikasi, dan peringkat kelompok dihitung per segmen. Saran di bawah ini dari tim pembuat aplikasi, <strong>bukan ketentuan resmi PIKR</strong>. Sesuaikan dengan pedoman PIKR di tempatmu.</p><h3>Berani, 10–14 tahun</h3><ul><li>Pakai kalimat pendek dan contoh yang dekat: teman, grup chat, game, media sosial.</li><li>Sesi lebih singkat (30 sampai 40 menit) dengan lebih banyak permainan dan gerak.</li><li>Bahas topik citra diri dan cemas secara sederhana. Hindari detail tentang tubuh.</li><li>Pastikan izin dari sekolah dan orang tua atau wali sesuai kebijakan penyelenggara, dan selalu ada pendamping dewasa di ruangan.</li></ul><h3>Beraksi, 15–19 tahun</h3><ul><li>Andalkan diskusi studi kasus, role-play singkat, dan pertanyaan pemantik.</li><li>Tema yang dekat: tekanan akademik, pertemanan, relasi, dan media sosial.</li><li>Beri ruang berpendapat dan jangan menggurui. Tanda bahaya tetap ditangani lewat Protokol keselamatan.</li><li>Ajak peserta yang antusias mencoba peran sebagai pendidik sebaya.</li></ul><h3>Berkolaborasi, 20–24 tahun</h3><ul><li>Perlakukan peserta sebagai rekan, bukan murid.</li><li>Tema yang dekat: transisi kuliah dan kerja, tekanan masa depan, dan relasi.</li><li>Ajak menjadi co-fasilitator, konselor sebaya, atau penggerak proyek kolaborasi.</li><li>Ganti rujukan guru BK dengan konselor kampus, layanan komunitas, atau puskesmas.</li></ul><h3>Kalau sesi terpaksa campur</h3><ul><li>Bagi diskusi per segmen, lalu bahas bersama.</li><li>Jangan membandingkan skor atau usia peserta di depan umum.</li><li>Jaga agar peserta yang lebih tua tidak mendominasi.</li></ul><div class='callout warm'><b class='t'>Ingat</b>Untuk peserta di bawah 18 tahun, ikuti kebijakan penyelenggara tentang izin dan pendampingan, termasuk saat membahas topik sensitif.</div>"},{"k":"siap","icon":"check","t":"Persiapan dan checklist","sub":"H-7, H-1, hari H, dan setelah sesi","html":"<h3>H-7</h3><ul><li>Dapatkan izin dari sekolah atau pihak terkait, dan koordinasikan dengan guru BK.</li><li>Siapkan <strong>daftar rujukan lokal</strong>: nama dan kontak guru BK, puskesmas terdekat, psikolog atau layanan konseling yang tersedia.</li><li>Pastikan link Ruang Jeda bisa dibuka peserta (pengaturan berbagi sudah benar). Uji di minimal 2 HP berbeda.</li><li>Tentukan siapa orang dewasa yang siaga di sekolah bila ada peserta membutuhkan bantuan.</li></ul><h3>H-1</h3><ul><li>Cetak poster QR: QR utama, QR per modul (akhiran #emosi, #cemas, #diri, atau #bully), dan QR FAQ PIKR (akhiran #pikr) untuk poster promosi.</li><li>Siapkan kertas, spidol, dan kesepakatan bersama yang ditulis besar.</li><li>Baca ulang rencana sesi modul dan kunci diskusi studi kasus.</li><li>Siapkan satu tempat tenang untuk peserta yang butuh jeda.</li></ul><h3>Hari H</h3><ul><li>Datang 20 menit lebih awal. Uji sinyal dan QR.</li><li>Atur kursi berkelompok atau melingkar.</li><li>Tulis kesepakatan bersama di papan.</li><li>Pastikan guru BK atau orang dewasa lain berada dekat ruangan.</li></ul><h3>Setelah sesi</h3><ul><li>Tindak lanjuti peserta yang kamu rujuk sesuai protokol.</li><li>Catat kejadian khusus secara singkat dan faktual.</li><li>Unduh rekap, bandingkan skor pre-test dan post-test.</li><li>Lakukan evaluasi singkat dengan guru BK atau tim PIKR.</li></ul>"},{"k":"protokol","icon":"ring","t":"Protokol keselamatan","sub":"Jika ada peserta yang membutuhkan bantuan","html":"<div class='callout warm'><b class='t'>Prinsip utama</b>Kamu tidak harus menyelesaikan masalah peserta. Tugasmu mendengarkan, menjaga peserta tetap aman, dan menghubungkannya dengan orang dewasa atau tenaga yang berwenang.</div><h3>A. Peserta menangis atau kewalahan</h3><ul><li>Tetap tenang dan hentikan kegiatan sebentar bila perlu.</li><li>Beri ruang. Tawarkan air, atau keluar sebentar dengan teman atau pendamping.</li><li>Jangan memaksa menjelaskan atau menyorotnya di depan peserta lain.</li><li>Setelah sesi, tanyakan kabarnya secara pribadi dan tawarkan bertemu guru BK.</li></ul><h3>B. Peserta menyebut ingin mengakhiri hidup atau menyakiti diri</h3><p>Ini bisa lewat ucapan, tulisan di aktivitas, atau komentar. Anggap serius, apa pun nadanya.</p><ol><li>Ajak bicara secara pribadi di tempat aman, dengan orang dewasa lain terlihat dekat.</li><li>Dengarkan tanpa menghakimi. Tanyakan langsung dan tenang: \"Apakah kamu sedang berpikir untuk mengakhiri hidupmu?\" Bertanya langsung tidak menanamkan ide.</li><li>Jangan berjanji merahasiakan. Katakan: \"Aku peduli dengan keselamatanmu, jadi aku perlu melibatkan orang dewasa yang bisa membantu.\"</li><li><strong>Jangan tinggalkan dia sendirian.</strong> Segera libatkan guru BK atau konselor, wali kelas atau pembina, atau orang tua sesuai kebijakan penyelenggara.</li><li>Jika ada bahaya langsung (ada rencana, alat, atau sudah melukai diri): hubungi <strong>112</strong> atau antar ke IGD terdekat sambil menemani.</li><li>Untuk berkonsultasi, kamu atau peserta bisa menghubungi layanan konseling kesehatan jiwa: 119 lalu tekan 8 (SEJIWA, Kementerian Kesehatan).</li><li>Jangan membahas cara atau detail metode, dan jangan menjanjikan \"semuanya akan baik-baik saja\". Cukup katakan bahwa ada orang yang mau membantu.</li><li>Catat kejadian secara singkat dan faktual, lalu pastikan ada tindak lanjut.</li></ol><h3>C. Peserta menyampaikan kekerasan atau pelecehan</h3><ul><li>Dengarkan dan percaya. Katakan: \"Terima kasih sudah berani cerita. Ini bukan salahmu.\"</li><li>Jangan menginterogasi atau meminta detail berulang-ulang.</li><li>Jangan berjanji merahasiakan. Jelaskan bahwa kamu perlu melibatkan orang dewasa yang berwenang untuk melindunginya.</li><li>Catat apa yang dikatakan dengan kata-katanya sendiri.</li><li>Laporkan ke guru BK atau kepala sekolah atau pimpinan lembaga sesuai prosedur perlindungan anak. SAPA 129 (Kementerian PPPA) juga menerima laporan.</li><li>Jika bahaya terjadi saat ini juga, hubungi 112.</li></ul><h3>D. Ada yang menertawakan atau meremehkan</h3><ul><li>Hentikan dengan tenang dan ingatkan kesepakatan bersama.</li><li>Jangan mempermalukan orangnya di depan peserta lain. Bicarakan secara pribadi.</li><li>Beri contoh respons yang menghargai.</li></ul><h3>E. Peserta diam atau tidak mau ikut</h3><ul><li>Biarkan. Boleh pass.</li><li>Beri peran lain: mencatat, menjaga waktu, atau membagi kertas.</li><li>Jangan menyorot atau memaksa.</li></ul><h3>F. Peserta menyebut nama orang lain</h3><ul><li>Hentikan dengan lembut: \"Kita tidak menyebut nama ya, supaya aman untuk semua. Kita bahas polanya dan solusinya.\"</li><li>Tawarkan bicara pribadi setelah sesi.</li></ul><h3>G. Peserta bertanya di luar kemampuanmu</h3><p>Misalnya soal obat, diagnosis, atau masalah keluarga yang berat. Katakan: \"Aku bukan tenaga kesehatan, jadi aku nggak bisa jawab itu. Kita cari ke psikolog atau puskesmas ya.\"</p><div class='callout warm'><b class='t'>Setelah kejadian</b>Ceritakan pada guru BK atau rekan fasilitator. Kamu juga boleh merasa terguncang. Jaga dirimu, dan jangan membawa beban ini sendirian. Nomor layanan dapat berubah, jadi pastikan daftar rujukanmu diperbarui.</div>"},{"k":"app","icon":"chart","t":"Memakai Ruang Jeda di sesi","sub":"QR, pre-test dan post-test, rekap, dan privasi","html":"<h3>Sebelum sesi</h3><ul><li>Pastikan link bisa dibuka peserta. Uji di 2 HP berbeda dan di sinyal yang sama dengan ruangan.</li><li>Cetak QR utama. Untuk QR per modul, tambahkan akhiran pada link: <strong>#emosi</strong>, <strong>#cemas</strong>, <strong>#diri</strong>, atau <strong>#bully</strong>. Akhiran <strong>#pikr</strong> langsung membuka menu FAQ bagian PIKR, cocok untuk poster promosi.</li><li>Siapkan rencana cadangan bila internet buruk: berpasangan satu HP, atau sampaikan materi secara lisan lalu isi pre-test dan post-test setelahnya.</li></ul><h3>Saat sesi</h3><ol><li>Tunjukkan QR. Peserta mengisi <strong>nama panggilan (bukan nama asli)</strong> dan memilih segmen sesuai usia (Berani 10–14, Beraksi 15–19, Berkolaborasi 20–24 tahun). Usia tidak disimpan, hanya segmennya.</li><li>Peserta mengerjakan <strong>pre-test sendiri-sendiri</strong> tanpa membuka materi. Tegaskan bahwa ini bukan nilai.</li><li>Materi disampaikan secara tatap muka. Peserta boleh membuka materi di HP sebagai pendamping.</li><li>Peserta mengerjakan <strong>post-test</strong>. Bahas bersama soal yang sering salah.</li><li>Ajak peserta mencoba tantangan harian dan check-in suasana hati di rumah.</li></ol><h3>Peringkat</h3><ul><li>Peringkat bersama hanya muncul bila peserta tersambung dan punya akses menulis. Kalau tidak, poin tetap tersimpan di HP masing-masing.</li><li>Jangan meminta peserta menyebut skor di depan peserta lain. Fokuskan pada perkembangan, bukan peringkat.</li><li>Peringkat kelompok mengikuti tiga segmen dan dihitung dari rata-rata poin per anggota, supaya adil bagi segmen yang jumlah pesertanya berbeda.</li></ul><h3>Rekap untuk kader</h3><ul><li>Tab <strong>Rekap</strong> hanya tampil untuk akun dengan akses editor.</li><li>Kolom <strong>Naik</strong> adalah rata-rata selisih post-test dan pre-test peserta yang mengerjakan keduanya.</li><li>Kartu <strong>Segmen dan PIKR</strong> menunjukkan jumlah peserta tiap segmen, berapa yang membaca FAQ bagian PIKR, dan berapa yang tertarik tahu lebih lanjut.</li><li>Tombol <strong>Unduh data (CSV)</strong> menghasilkan file yang bisa dibuka di Excel atau Google Sheets.</li></ul><h3>Privasi peserta</h3><ul><li>Aplikasi tidak meminta nama asli, nomor HP, atau email.</li><li>Check-in suasana hati hanya tersimpan di HP peserta dan tidak masuk rekap.</li><li>Yang masuk rekap hanya nama panggilan, segmen, poin, skor pre-test dan post-test, minat pada PIKR, dan jawaban survei.</li></ul>"},{"k":"promo","icon":"people","t":"Mempromosikan PIKR","sub":"Pitch, saluran, etika, dan cara mengukur hasilnya","html":"<h3>Tujuan</h3><p>Remaja di Bandung yang belum kenal PIKR menjadi <strong>tahu</strong> apa itu PIKR, <strong>paham</strong> manfaatnya, dan <strong>tahu cara menghubungi atau bergabung</strong>. Tujuannya bukan memaksa orang mendaftar. Orang yang merasa nyaman lebih mungkin datang sendiri.</p><h3>Pesan inti (pilih dua saja tiap kesempatan)</h3><ul><li>PIKR dikelola <strong>dari, oleh, dan untuk remaja</strong>.</li><li>Bukan hanya untuk yang sedang bermasalah. Bisa untuk belajar, mencari teman, dan berlatih memimpin atau menyampaikan informasi.</li><li>Ada teman sebaya yang dilatih untuk mendengarkan tanpa menghakimi.</li><li>Topiknya luas, dari gizi dan keterampilan hidup sampai kesehatan mental.</li><li>Ruang Jeda gratis, tanpa daftar akun, dan cukup memakai nama panggilan.</li></ul><div class='callout'><b class='t'>Pitch 30 detik (untuk di kelas, kampus, atau komunitas)</b>\"Pernah stres atau overthinking tapi bingung mau cerita ke siapa? Itu dialami banyak remaja. PIKR adalah Pusat Informasi dan Konseling Remaja, tempat remaja belajar dan saling mendengarkan, dikelola dari, oleh, dan untuk remaja. Kami buat Ruang Jeda, aplikasi singkat tentang kesehatan mental yang bisa kamu buka lewat QR tanpa daftar. Coba satu modul 5 menit, dan kalau tertarik, kenalan sama PIKR.\"</div><div class='callout'><b class='t'>Pitch 10 detik (untuk poster dan story)</b>\"Stres? Overthinking? Kenalan sama PIKR. Scan QR, belajar 5 menit di Ruang Jeda.\"</div><h3>Saluran</h3><ul><li>Poster QR di mading, kantin, perpustakaan, ruang BK atau OSIS, sekretariat ekstrakurikuler, dan kampus, dengan izin pengelola tempat.</li><li>Grup WhatsApp angkatan, kelas, OSIS, ekskul, atau komunitas, lewat perwakilan yang kamu kenal. Jangan memasukkan orang ke grup tanpa izin.</li><li>Instagram dan TikTok PIKR: video 15 sampai 30 detik seperti latihan napas atau mitos dan fakta tentang PIKR.</li><li>Slot 5 menit di apel, MPLS, kegiatan OSIS, atau ospek, bersama guru BK atau bagian kemahasiswaan.</li><li>Kerja sama dengan guru BK, OSIS, puskesmas, karang taruna, dan komunitas remaja.</li><li>Acara terbuka yang berizin, misalnya bazar sekolah, acara komunitas, atau car free day, dengan stan kecil dan QR.</li></ul><h3>Contoh keterangan untuk Instagram</h3><div class='callout'>Pernah overthinking sampai susah tidur? Kamu nggak sendirian. Kenalan sama PIKR, tempat remaja belajar dan saling mendengarkan. Coba Ruang Jeda, 5 menit aja. Scan QR di poster atau cek link di bio. #RuangJeda #PIKR #Bandung #KesehatanMentalRemaja</div><h3>Etika promosi</h3><ul><li>Dapatkan izin sekolah atau pengelola tempat sebelum menempel poster atau masuk kelas.</li><li>Jangan menekan, jangan menjanjikan hasil (misalnya \"pasti sembuh\"), dan jangan menyebut PIKR sebagai pengganti psikolog.</li><li>Jangan memajang wajah, nama, atau cerita pribadi peserta tanpa izin tertulis, dan izin orang tua bagi yang berusia di bawah 18 tahun.</li><li>Jangan mengumpulkan nomor HP atau akun media sosial remaja lewat Ruang Jeda. Aplikasi ini memang tidak memintanya.</li><li>Sertakan jalur bantuan di materi promosi yang membahas kesehatan mental, dan hindari bahasa yang menakut-nakuti atau meremehkan.</li><li>Pastikan kontak dan jadwal PIKR benar sebelum dicetak.</li></ul><h3>Mengukur hasilnya</h3><ul><li>Di Rekap, kartu <strong>Segmen dan PIKR</strong> menunjukkan jumlah peserta per segmen, berapa yang membaca FAQ bagian PIKR, dan berapa yang tertarik tahu lebih lanjut.</li><li>Survei menanyakan apakah peserta <strong>lebih paham apa itu PIKR</strong> dan apakah <strong>tertarik ikut kegiatan PIKR</strong>.</li><li>Dari sisi PIKR sendiri: catat jumlah pendaftar atau kunjungan baru tiap minggu, lalu bandingkan dengan sebelum kampanye.</li><li>Tanyakan pada pendaftar baru, \"Tahu PIKR dari mana?\"</li></ul><div class='callout warm'><b class='t'>Batas pengukuran</b>Rekap hanya mengukur peserta yang membuka aplikasi. Angka minat bukan jumlah pendaftar. Pendaftaran tetap terjadi lewat kontak PIKR.</div>"},{"k":"evaluasi","icon":"trend","t":"Evaluasi dan tindak lanjut","sub":"Membaca rekap dan refleksi fasilitator","html":"<h3>Membaca rekap</h3><ul><li><strong>Skor pre-test rendah</strong> berarti topiknya memang baru bagi peserta. Itu wajar, jangan dianggap kegagalan.</li><li><strong>Kenaikan besar</strong> pada satu modul menunjukkan materi dan cara menyampaikannya cocok.</li><li><strong>Kenaikan kecil atau turun</strong>: periksa soal yang paling sering salah, lalu diskusikan ulang konsepnya di pertemuan berikutnya.</li><li><strong>Banyak yang tidak menyelesaikan post-test</strong>: mungkin waktu terlalu singkat atau sinyal buruk.</li></ul><div class='callout warm'><b class='t'>Hati-hati menafsirkan</b>Skor naik berarti pengetahuan bertambah. Itu belum membuktikan perilaku berubah. Untuk melihat dampak jangka panjang, perlu tindak lanjut dalam beberapa minggu.</div><h3>Refleksi fasilitator (setelah tiap sesi)</h3><ol><li>Bagian mana yang membuat peserta paling terlibat?</li><li>Bagian mana yang terasa membingungkan atau terlalu cepat?</li><li>Adakah peserta yang perlu ditindaklanjuti? Siapa yang akan menghubungi, dan kapan?</li><li>Apa satu hal yang akan kamu ubah di sesi berikutnya?</li></ol><h3>Tindak lanjut yang disarankan</h3><ul><li>Kirim pengingat tantangan harian ke peserta lewat grup PIKR.</li><li>Adakan sesi tanya jawab singkat 2 minggu kemudian.</li><li>Ulangi survei kepuasan dan bandingkan hasilnya.</li></ul>"}];
var FASIL_MOD={"emosi":{"tujuan":["Peserta dapat menyebut emosi dasar dan fungsinya","Peserta dapat mengenali sinyal stres dari tubuh, pikiran, dan perilaku","Peserta tahu kapan harus meminta bantuan dan kepada siapa","Peserta mencoba satu cara mengelola stres"],"persiapan":["HP peserta (berpasangan bila kurang)","Kertas dan spidol","Poster QR modul (link dengan akhiran #emosi)","Papan tulis atau flipchart","Daftar kontak rujukan lokal"],"ice":{"judul":"Cuaca hatiku","langkah":["Minta peserta menyebut cuaca yang menggambarkan perasaannya sekarang (cerah, mendung, hujan, badai), dalam satu kata atau gerakan.","Boleh pass.","Rangkum: berbagai perasaan itu hadir bersamaan dan semuanya wajar."]},"pemantik":["Kapan terakhir kali kamu merasa sangat marah, dan apa yang kamu lakukan?","Kalau stres, bagian tubuh mana yang biasanya duluan terasa?","Kenapa banyak orang bilang \"aku nggak apa-apa\" padahal sebenarnya tidak?"],"inti":[["Semua emosi itu normal","Tulis lima emosi dasar di papan dan minta peserta menyebut fungsinya sebelum kamu menjelaskan.","Anggapan \"emosi negatif itu buruk\" dan \"laki-laki tidak boleh menangis\". Luruskan dengan lembut."],["Sinyal dari tubuh dan pikiran","Ajak peserta melakukan cek tubuh 30 detik bersama.","Menganggap gejala fisik pasti dibuat-buat. Ingatkan perlunya pemeriksaan medis bila gejala berulang."],["Stres: wajar atau perlu bantuan","Gunakan tiga pertanyaan penentu (berapa lama, seberapa berat, reda atau tidak). Gambar tabel dua kolom.","Kesan bahwa semua stres harus dihilangkan, atau sebaliknya semua stres boleh diabaikan."],["Lima cara mengelola stres","Lakukan napas 4-6 bersama selama 1 menit. Minta peserta memilih satu cara untuk dicoba minggu ini.","Jawaban tunggal seperti \"yang penting kuat saja\". Tegaskan ada beberapa langkah praktis dan ada bantuan orang dewasa."]],"kunci":["<strong>Tubuh:</strong> sulit tidur, sakit perut tiap Senin. <strong>Pikiran:</strong> tertekan harus masuk tiga besar. <strong>Perilaku:</strong> mudah marah pada adik, menarik diri, berkata \"nggak apa-apa\".","Raka mungkin takut dianggap lemah atau mengecewakan orang tua. Jangan menebak berlebihan. Pakai ini untuk membantu peserta memahami kenapa orang menutup diri.","Langkah kecil: napas, tidur lebih awal, memecah tugas, bercerita ke satu orang (guru BK, kakak, kader). Ia juga bisa bilang ke orang tua, \"Aku lagi kewalahan.\""],"aktivitas":["Bagikan kertas. Peserta mengerjakan Peta emosi 3 menit secara individu.","Minta 2 sampai 3 sukarelawan berbagi satu emosi (tidak perlu menyebut penyebabnya).","Tutup dengan satu napas panjang bersama."],"waspada":["Peserta yang tiba-tiba diam atau menangis saat membahas stres: beri jeda dan tawarkan keluar sebentar, jangan menyorotnya.","Jawaban yang menyiratkan keinginan menyakiti diri: ikuti Protokol keselamatan dan jangan lanjutkan sebagai bahan diskusi."],"penutup":"Hari ini kita belajar bahwa semua perasaan itu normal dan ada caranya untuk mengelolanya. Kalau perasaanmu terasa berat berhari-hari, ceritakan pada orang yang kamu percaya. Tombol Bantuan ada di aplikasi."},"cemas":{"tujuan":["Peserta dapat membedakan cemas yang wajar dan overthinking","Peserta mengenali lingkaran pikiran yang membuat cemas menguat","Peserta mencoba dua alat: memeriksa pikiran dan menenangkan tubuh","Peserta tahu tanda yang perlu bantuan profesional"],"persiapan":["HP peserta (berpasangan bila kurang)","Kertas dan spidol","Poster QR modul (link dengan akhiran #cemas)","Papan tulis untuk menggambar lingkaran pikiran","Daftar kontak rujukan lokal"],"ice":{"judul":"Tebak penjelasannya","langkah":["Bacakan situasi: \"Pesanmu sudah dibaca tiga jam, belum dibalas.\"","Peserta menulis tiga kemungkinan penjelasan, mulai dari yang paling buruk sampai yang biasa saja.","Bahas: satu kejadian bisa punya banyak penjelasan, dan otak sering memilih yang paling menakutkan."]},"pemantik":["Hal apa yang paling sering kamu pikirkan sampai susah tidur?","Apa bedanya merencanakan dengan overthinking menurutmu?","Apa yang biasanya kamu lakukan saat cemas, dan apakah itu membantu?"],"inti":[["Cemas dan overthinking itu apa?","Tanyakan, \"Setelah memikirkan ini, aku punya langkah baru atau tidak?\" dan minta contoh dari peserta.","Menganggap cemas selalu buruk atau overthinking tanda pintar. Tegaskan ini istilah sehari-hari, bukan diagnosis."],["Lingkaran pikiran yang berputar","Gambar lingkaran lima langkah di papan. Minta peserta menunjuk titik yang paling mudah diputus.","Menganggap meminta jaminan itu manja. Jelaskan bahwa otak belajar bergantung pada jaminan."],["Alat 1: periksa pikiranmu","Latihan bersama dengan satu pikiran contoh. Tuliskan empat langkahnya di papan.","Menyuruh \"jangan dipikirin\". Itu jarang berhasil. Gunakan alat yang diajarkan."],["Alat 2: tenangkan tubuh","Praktikkan grounding 5-4-3-2-1 bersama selama 2 menit.","Mendiagnosis peserta. Jangan bilang \"kamu gangguan kecemasan\". Katakan \"layak diperiksa tenaga profesional\"."]],"kunci":["Putaran mulai di langkah 2: \"dia pasti marah\" dari satu kejadian (centang dua) tanpa bukti.","Pertanyaan yang bisa Dinda ajukan: apa buktinya, ada kemungkinan lain, dan kalau temanku yang mengalami, aku bilang apa.","<strong>Bisa dikendalikan:</strong> tidur tepat waktu, mengirim satu pesan yang jelas besok. <strong>Tidak bisa:</strong> kapan atau bagaimana sahabatnya membalas. Membuka chat belasan kali dan bertanya ke teman justru menguatkan lingkaran."],"aktivitas":["Pimpin grounding 5-4-3-2-1 pelan-pelan (2 menit).","Peserta menulis satu pikiran \"gimana kalau\" lalu mengujinya dengan bukti.","Pasangan boleh saling membaca bila nyaman. Jangan memaksa."],"waspada":["Peserta yang terlihat sangat cemas atau mengalami serangan panik di sesi: hentikan sebentar, ajak napas pelan, temani, dan jangan menyuruh \"tenang saja\".","Bila peserta menyebut cemas berat berminggu-minggu: tawarkan bicara dengan guru BK setelah sesi."],"penutup":"Pikiran bukan fakta. Kalau pikiranmu berputar, coba periksa buktinya dan tenangkan tubuhmu dulu. Kalau cemas terasa berat atau berulang, bicarakan dengan guru BK atau tenaga kesehatan."},"diri":{"tujuan":["Peserta dapat membedakan self-love, egois, dan memanjakan diri","Peserta memahami pengaruh media sosial pada citra diri","Peserta mengubah suara \"juri\" menjadi suara \"pelatih\"","Peserta mengenali kekuatan dirinya"],"persiapan":["HP peserta (berpasangan bila kurang)","Kertas dan spidol","Poster QR modul (link dengan akhiran #diri)","Papan tulis untuk tabel juri dan pelatih","Daftar kontak rujukan lokal"],"ice":{"judul":"Satu hal yang kulakukan dengan baik","langkah":["Minta peserta menulis satu hal yang mereka lakukan dengan baik minggu ini, sekecil apa pun.","Boleh pass atau menyimpannya sendiri.","Sebutkan bahwa banyak orang merasa canggung memuji diri sendiri, dan itu bisa dilatih."]},"pemantik":["Akun apa yang paling sering membuatmu merasa kurang, dan kenapa?","Kalau sahabatmu bilang \"aku jelek\", kamu jawab apa? Lalu apa yang kamu katakan pada dirimu sendiri?","Apa bedanya percaya diri dan sombong menurutmu?"],"inti":[["Self-love bukan egois","Gunakan tiga kolom: self-love, egois, memanjakan diri. Minta peserta mengelompokkan contoh perilaku.","Menganggap self-love itu manja atau tidak ada standar. Tegaskan self-love tetap berarti bertanggung jawab."],["Citra diri dan media sosial","Ajak audit feed 3 langkah dan minta peserta menyebut satu perubahan yang bisa dilakukan.","Menyalahkan media sosial sepenuhnya. Fokus pada apa yang bisa diatur peserta."],["Suara dalam kepalamu","Tuliskan tabel juri dan pelatih di papan. Minta peserta mengubah satu kalimat juri menjadi kalimat pelatih.","Meminta peserta \"berpikir positif saja\". Kalimat pelatih harus jujur dan menunjuk langkah, bukan hanya manis."],["Membangun harga diri dari hal nyata","Ajak peserta menyebut satu kekuatan dan satu nilai yang mereka pegang.","Memuji penampilan fisik peserta sebagai contoh. Hindari komentar tentang tubuh."]],"kunci":["Nadia membandingkan feed-nya yang apa adanya (jerawat, malam hari) dengan sorotan terbaik orang lain.","Versi pelatih: \"Aku lagi merasa kurang menarik. Itu perasaan, bukan fakta. Aku bisa...\" lalu tunjuk satu langkah kecil.","Perubahan yang bisa dilakukan: mute 3 akun pemicu, ikuti akun yang bermanfaat, jam tanpa layar sebelum tidur, dan sesekali mengunggah apa adanya."],"aktivitas":["Surat untuk sahabat (5 menit): peserta menulis tiga kalimat yang akan mereka ucapkan pada sahabat yang mengalami hal serupa, lalu membacakannya untuk diri sendiri.","Audit feed: peserta mute atau unfollow tiga akun saat itu juga bila nyaman."],"waspada":["Topik penampilan dan tubuh bisa sensitif. Jangan mengomentari tubuh peserta, dan jangan menyebut target berat badan atau diet.","Peserta yang mengatakan membenci tubuhnya atau mengatur makan secara ekstrem: temui secara pribadi setelah sesi dan rujuk ke guru BK atau tenaga kesehatan."],"penutup":"Kamu bukan hasil dari angka like atau penilaian orang lain. Bersikaplah pada dirimu seperti kamu bersikap pada sahabat. Kalau pikiran negatif tentang dirimu terasa menguasai hari, ceritakan pada orang yang kamu percaya."},"bully":{"tujuan":["Peserta mengenali bullying, termasuk cyberbullying, dan membedakannya dari bercanda dan konflik","Peserta berlatih menolak tekanan teman sebaya","Peserta tahu langkah aman bila menjadi korban","Peserta mengenali peran saksi dan pilihan yang aman"],"persiapan":["HP peserta (berpasangan bila kurang)","Kertas kecil untuk menulis anonim","Poster QR modul (link dengan akhiran #bully)","Papan tulis","Daftar kontak rujukan lokal"],"ice":{"judul":"Garis tipis","langkah":["Bagikan kertas kecil. Peserta menulis anonim satu hal yang sering dianggap candaan padahal menyakitkan.","Kumpulkan, acak, lalu bacakan beberapa tanpa menyebut siapa penulisnya.","Bahas: kenapa sesuatu bisa terasa lucu bagi satu orang dan menyakitkan bagi orang lain."]},"pemantik":["Kapan candaan berubah menjadi bullying?","Kenapa banyak orang diam saat melihat temannya dirundung?","Siapa orang dewasa di sekolah atau kampus yang kamu percaya?"],"inti":[["Apa itu bullying?","Tuliskan tiga ciri (disengaja, berulang, timpang). Minta peserta mengelompokkan contoh ke bercanda, konflik, atau bullying.","Menganggap bullying hanya kekerasan fisik. Tegaskan bentuk verbal, sosial, dan siber."],["Tekanan teman sebaya","Praktikkan S-N-A-P berpasangan dengan satu situasi, misalnya ajakan bolos.","Menyalahkan korban tekanan karena \"mau-mau saja\". Akui bahwa menolak itu sulit."],["Kalau kamu sasaran bullying","Tekankan kalimat \"ini bukan salahmu\". Ajak peserta menyebutkan siapa yang bisa dihubungi.","Menyarankan membalas dengan kekerasan. Arahkan ke langkah aman dan bukti."],["Peran saksi, dan kalau kamu pelakunya","Bahas empat pilihan aman (alihkan, dekati, ajak teman, laporkan) dan minta peserta memilih yang paling realistis.","Meminta peserta menghadapi pelaku sendirian. Pastikan mereka tahu ada pilihan yang aman."]],"kunci":["Ini bullying siber: berulang (banyak yang ikut) dan timpang (Rafi sendirian, makin menyendiri).","Pilihan Bima: meneruskan (ikut menyakiti), diam (tidak membantu), atau tidak menyebarkan, mendekati Rafi, dan melapor (paling membantu).","Contoh kalimat: \"Nggak, aku nggak mau forward. Kasihan Rafi.\" Lalu kirim pesan ke Rafi: \"Aku di sini kalau kamu butuh teman cerita.\""],"aktivitas":["Peserta menulis tiga kalimat menolak, lalu berlatih berpasangan (1 menit per orang).","Peserta menulis tiga orang dewasa tepercaya dan menyimpan kontaknya."],"waspada":["Jangan meminta peserta menyebut nama pelaku atau korban di depan peserta lain. Bila ada yang menyebut, arahkan membicarakannya setelah sesi.","Pengungkapan kekerasan atau pelecehan: ikuti Protokol keselamatan dan libatkan guru BK.","Hindari role-play yang meminta peserta memerankan pelaku secara menyakitkan."],"penutup":"Bullying bisa dihentikan, dan setiap orang punya peran. Kalau kamu atau temanmu dirundung, ini bukan salahmu dan kamu berhak meminta bantuan. Tombol Bantuan ada di aplikasi."}};
var FASIL_TL=[["0 – 5","Pembukaan dan kesepakatan bersama","Sambut peserta, bacakan kesepakatan bersama, jelaskan tujuan sesi dan bahwa ini bukan penilaian."],["5 – 10","Pre-test lewat QR","Peserta mengisi nama panggilan dan mengerjakan pre-test sendiri, tanpa membuka materi."],["10 – 18","Ice-breaker dan pertanyaan pemantik","Lakukan ice-breaker, lalu ajukan 1 sampai 2 pertanyaan pemantik."],["18 – 36","Pemaparan inti","Empat bagian materi, sekitar 4 menit tiap bagian, selingi tanya jawab dan satu praktik."],["36 – 46","Studi kasus","Kelompok 4 sampai 5 orang berdiskusi 6 menit, lalu pleno 4 menit."],["46 – 52","Aktivitas","Pandu aktivitas sesuai modul."],["52 – 58","Post-test","Peserta mengerjakan post-test, lalu bahas soal yang sering salah."],["58 – 60","Penutup","Sampaikan pesan kunci, tunjukkan tombol Bantuan, kenalkan PIKR lewat menu FAQ bagian PIKR (1 menit), dan ajak mencoba tantangan harian."]];
function fasilItem(k,t,sub,icon,color){return '<button class="mod" data-a="fasil" data-k="'+k+'"><span class="glyph" style="background:'+color+'">'+ic(icon)+'</span><span class="grow"><h3>'+esc(t)+'</h3><span class="small muted">'+esc(sub)+'</span></span>'+ic("right")+'</button>';}
function lst(tag,a){return '<'+tag+'>'+a.map(function(x){return '<li>'+x+'</li>';}).join("")+'</'+tag+'>';}
function planHtml(m){
  var f=FASIL_MOD[m.id],h='';
  function sec(t,body){h+='<div class="card"><h2>'+t+'</h2><div class="prose">'+body+'</div></div>';}
  h+='<div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="glyph" style="background:'+m.color+'">'+ic(m.icon)+'</span><div class="grow"><div class="eyebrow">Rencana sesi 60 menit</div><h1 style="font-size:1.4rem">'+esc(m.name)+'</h1></div></div></div>';
  sec("Tujuan sesi",lst("ul",f.tujuan));
  sec("Yang perlu disiapkan",lst("ul",f.persiapan));
  var rows=FASIL_TL.map(function(r,i){
    var c=r[2];
    if(i===2)c="Lakukan ice-breaker \""+f.ice.judul+"\", lalu ajukan 1 sampai 2 pertanyaan pemantik.";
    if(i===5)c="Pandu aktivitas \""+m.kasus.aktivitas.judul+"\".";
    return '<tr><td style="white-space:nowrap">'+r[0]+'</td><td><b>'+r[1]+'</b></td><td>'+c+'</td></tr>';
  }).join("");
  sec("Alur sesi",'<div class="scroll-x"><table class="table"><thead><tr><th>Menit</th><th>Kegiatan</th><th>Cara</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="small muted" style="margin-top:8px">Versi 30 menit: pembukaan 3, pre-test 5, dua bagian materi pilihan 10, studi kasus 7, post-test dan penutup 5.</p>');
  sec("Ice-breaker: "+f.ice.judul,lst("ol",f.ice.langkah));
  sec("Pertanyaan pemantik",lst("ul",f.pemantik));
  sec("Membawakan tiap materi",f.inti.map(function(x,i){return '<h3>Materi '+(i+1)+': '+x[0]+'</h3><p><strong>Cara membawakan:</strong> '+x[1]+'</p><p><strong>Salah paham yang sering muncul:</strong> '+x[2]+'</p>';}).join(""));
  sec("Kunci diskusi: "+m.kasus.judul.replace(/^Studi kasus: /,""),'<p class="small muted">Gunakan sebagai panduan, bukan jawaban tunggal. Biarkan peserta menyampaikan pendapatnya dulu.</p>'+lst("ol",f.kunci));
  sec("Memandu aktivitas: "+m.kasus.aktivitas.judul,lst("ol",f.aktivitas));
  sec("Yang perlu diwaspadai",lst("ul",f.waspada)+'<p class="small">Pegangan utama ada di <button class="btn small" data-a="fasil" data-k="protokol">Protokol keselamatan</button></p>');
  sec("Kalimat penutup",'<div class="callout warm" style="margin:0">'+esc(f.penutup)+'</div>');
  return h;
}

function vFasil(){

    h+='<div class="eyebrow" style="margin-top:6px">Rencana sesi per modul (60 menit)</div>';
    MODS.forEach(function(m){h+=fasilItem(m.id,m.name,"Alur sesi, pertanyaan pemantik, kunci diskusi",m.icon,m.color);});
  }else{
    h+='<button class="btn ghost small" data-a="fasil" data-k="" style="align-self:flex-start">'+ic("left")+' Panduan fasilitator</button>';
    var info=null;FASIL_INFO.forEach(function(x){if(x.k===k)info=x;});
    var m=mod(k);
    if(info)h+='<div class="card"><div class="eyebrow">'+esc(info.sub)+'</div><h1 style="font-size:1.5rem;margin:6px 0 14px">'+esc(info.t)+'</h1><div class="prose">'+info.html+'</div></div>';
    else if(m)h+=planHtml(m);
    else h+='<div class="card"><p>Halaman tidak ditemukan.</p></div>';
  }
  return h+'</div>';
}

/* ---------- Event ---------- */
var H={
 nav:function(d){
   var v=d.v;
   if(v==="rekap"&&!ADMIN)v="home";
   if(v==="me"){SV={a:0,b:0,c:0,d:0,e:0};}
   go({v:v});
 },
 start:function(){go({v:"onb"});},
 open:function(d){go({v:"mod",id:d.id});},
 read:function(d){var m=mod(d.id);if(S.pre[m.id]==null){toast("Kerjakan pre-test dulu");return;}go({v:"read",id:d.id,i:+d.i});},
 doneRead:function(d){
   var m=mod(d.id),i=+d.i,secs=S.sec[m.id]||[];
   if(!secs[i]){secs[i]=1;S.sec[m.id]=secs;afterChange("+10 poin");}
   if(i<4)go({v:"read",id:d.id,i:i+1});else go({v:"mod",id:d.id});
 },
 test:function(d){
   var m=mod(d.id);
   if(d.k==="pre"&&S.pre[m.id]!=null)return;
   if(d.k==="post"&&secCount(m)<5){toast("Selesaikan semua materi dulu");return;}
   T={id:d.id,kind:d.k,i:0,sel:null,locked:false,ans:[],done:false};
   R={v:"test"};stopBreath();render();window.scrollTo(0,0);
 },
 pick:function(d){
   if(!T||T.locked)return;
   T.sel=+d.i;
   if(T.kind==="post")T.locked=true;
   render();
 },
 nextQ:function(){
   if(!T||T.sel==null)return;
   var m=mod(T.id);
   T.ans.push(T.sel);
   if(T.i<m.tes.length-1){T.i++;T.sel=null;T.locked=false;render();window.scrollTo(0,0);return;}
   var sc=T.ans.reduce(function(a,b,i){return a+(b===m.tes[i].a?1:0);},0);
   if(T.kind==="pre"){if(S.pre[m.id]==null)S.pre[m.id]=sc;afterChange("+10 poin");}
   else{var prev=S.post[m.id];if(prev==null||sc>prev)S.post[m.id]=sc;afterChange("Skor tersimpan");}
   T.done=true;render();window.scrollTo(0,0);
 },
 quitTest:function(){var id=T&&T.id;T=null;go({v:"mod",id:id});},
 mood:function(d){
   var k=dkey();if(S.mood[k]==null){S.mood[k]=+d.n;afterChange("+5 poin");}else{S.mood[k]=+d.n;persist();}
   render();
 },
 chal:function(){var k=dkey();if(!S.chal[k]){S.chal[k]=1;afterChange("+15 poin");}render();},
 help:function(){$("#overlay").innerHTML=helpSheet();},
 closeHelp:function(){$("#overlay").innerHTML="";},
 btab:function(d){boardTab=d.t;render();},
 bseg:function(d){boardSeg=d.s;render();},
 faqTab:function(d){faqTab=d.t;render();},
 rename:function(){OB=null;R={v:"onb"};render();window.scrollTo(0,0);},
 randNick:function(){var n=$("#nick");if(n)n.value=randNick();},
 segPick:function(d){
   var n=$("#nick");
   OB=OB||{nick:"",seg:""};
   if(n)OB.nick=n.value||"";
   OB.seg=d.v;render();
 },
 saveNick:function(){
   var n=($("#nick").value||"").trim();
   function bad(m){onbErr=m;$("#onbErr").textContent=m;}
   if(!/^[A-Za-z0-9 _\-]{3,16}$/.test(n)){bad("Nama panggilan 3 sampai 16 karakter: huruf, angka, spasi, _ atau -.");return;}
   if(!OB||!OB.seg){bad("Pilih segmenmu dulu.");return;}
   var first=!S.nick;
   S.nick=n;S.seg=OB.seg;OB=null;onbErr="";persist();queueSync();
   go({v:first?"home":"me"});
   if(first)toast("Selamat datang, "+n);
 },
 rate:function(d){SV[d.k]=+d.n;render();},
 sendSurvey:function(){if(SV.a&&SV.b&&SV.c&&SV.d&&SV.e){S.puas={a:SV.a,b:SV.b,c:SV.c,d:SV.d,e:SV.e};afterChange("+20 poin, terima kasih");render();}},
 resetAsk:function(){resetConfirm=true;render();},
 resetNo:function(){resetConfirm=false;render();},
 resetYes:function(){
   var ref=docRef;docRef=null;clearTimeout(syncT);
   if(ref){ref.delete().catch(function(){});}
   S=blank();persist();SV={a:0,b:0,c:0,d:0,e:0};boardSeg=null;
   if(ref){setTimeout(function(){docRef=ref;},500);}
   go({v:"welcome"});
 },
 csv:function(){if(DL)exportCsv();},
 brStart:function(){runBreath();},
 brStop:function(){stopBreath();var b=$("#brBtn"),t=$("#brTxt"),o=$("#orb");if(b){b.textContent="Mulai";b.setAttribute("data-a","brStart");}if(t)t.textContent="Siap?";if(o){o.style.transform="scale(.75)";o.textContent="4";}var s=$("#brSub");if(s)s.textContent="";},
 noop:function(){},
 fasil:function(d){go({v:"fasil",k:d.k||""});},
 pikrDone:function(){if(!S.pikrRead){S.pikrRead=true;afterChange("+10 poin");}render();},
 minat:function(){S.minat=!S.minat;afterChange(S.minat?"Minatmu tercatat":"Minat dibatalkan");render();},
 copyAjak:function(){
   var t=ajakText();
   function fb(){toast("Tekan lama pada teks untuk menyalin");}
   try{
     if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Pesan disalin");},fb);}else fb();
   }catch(e){fb();}
 }
};
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(!el)return;
  if(el.getAttribute("data-a")==="closeHelp"&&e.target.closest("[data-stop]")&&!e.target.closest("button[data-a='closeHelp']"))return;
  var f=H[el.getAttribute("data-a")];
  if(f){e.preventDefault();f(el.dataset,el);}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")H.closeHelp();});

/* ---------- Mulai ---------- */
(function boot(){
  var hsh=(location.hash||"").replace("#","");
  var map={emosi:1,cemas:1,diri:1,bully:1};
  if(hsh==="fasilitator"){R={v:"fasil",k:""};}
  else if(hsh==="pikr"||hsh==="faq"){R={v:"faq"};faqTab=hsh==="pikr"?"pikr":"app";}
  else if(!S.nick){R={v:"welcome"};}
  else{
    if(map[hsh])R={v:"mod",id:hsh};
    else if(hsh==="peringkat")R={v:"board"};
    else if(hsh==="modul")R={v:"mods"};
    else if(hsh==="napas")R={v:"napas"};
    else if(hsh==="bantuan"){R={v:"home"};}
  }
  render();
  if(S.nick&&hsh==="bantuan")H.help();
  initCaps();
})();

})();
